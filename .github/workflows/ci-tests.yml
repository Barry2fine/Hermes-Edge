name: Hermes-Edge Safety & Postmortem Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ".:src"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run 28-Test Engine Safety & Diagnostics Suite
        run: python test_engine_safety_and_diagnostics.py -v
      - name: Run isolated offline alert and postmortem regressions
        run: python -B tests/run_offline_repairs.py
