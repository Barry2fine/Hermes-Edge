name: Hermes-Edge 103-Seat Multi-Domain Committee & KuCoin Post-Mortem CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '23 */4 * * *'

jobs:
  test-and-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: "."
    steps:
      - name: Checkout Hermes-Edge
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run offline committee, evidence and persistence tests
        run: python -m pytest -q tests/
